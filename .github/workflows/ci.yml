name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  java-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run loopback protocol tests
        run: sh cast-launcher/test.sh
      - name: Render and validate offline artwork
        run: sh cast-launcher/preview.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check build script syntax
        run: node --check cast-launcher/build.mjs
      - name: Check website content and motion
        run: node --test test/site.test.mjs test/motion.test.mjs
